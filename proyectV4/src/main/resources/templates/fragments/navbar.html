<header th:fragment="navbar(currentPage)" class="topbar site-navbar"
        xmlns:th="http://www.thymeleaf.org">
  <a class="brand" href="/" aria-label="ProyectV4, inicio">
    <span class="brand-mark" aria-hidden="true">P3</span>
    <span>ProyectV4</span>
  </a>
  <button class="site-nav-toggle" type="button" aria-label="Abrir menú"
          aria-controls="site-navigation" aria-expanded="false" data-nav-toggle>
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="site-nav-links" id="site-navigation" aria-label="Navegación principal">
    <a href="/#inicio">Inicio</a>
    <a href="/#routes">Rutas</a>
    <a th:if="${currentPage == 'index'}" href="/people">Personas</a>
    <a th:if="${currentPage == 'index'}" href="/thymeTest">Thymeleaf</a>
    <a th:if="${currentUser != null}" href="/dashboard">Panel</a>
  </nav>
  <div class="site-nav-actions">
    <a class="site-nav-cta" th:if="${currentUser == null}"
       th:href="${currentPage == 'login'} ? @{/register} : @{/login}"
       th:text="${currentPage == 'login'} ? 'Crear cuenta' : 'Iniciar sesión'">Iniciar sesión</a>
    <form class="site-nav-logout-form" th:if="${currentUser != null}"
          th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="site-nav-cta" type="submit">Cerrar sesión</button>
    </form>
  </div>
</header>
