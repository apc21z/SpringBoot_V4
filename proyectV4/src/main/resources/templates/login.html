<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { min-height: 100vh; background: linear-gradient(135deg, #f4f3ed 0%, #edf4ee 100%); }
    .auth-page .site-navbar { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }
    .auth-shell { width: min(440px, calc(100% - 28px)); margin: clamp(48px, 9vh, 88px) auto 48px; }
    .auth-card { background: #fffefa; border: 1px solid #d9dcd1; border-radius: 18px; box-shadow: 0 18px 40px rgba(49,92,69,0.08); padding: 32px; }
    .auth-card h1 { font-size: 2rem; margin: 0 0 8px; }
    .auth-card p { color: #686f65; margin: 0 0 20px; }
    .alert { padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-size: 0.94rem; }
    .alert.error { background: #fde9e6; color: #a23d2c; border: 1px solid #e5b2a8; }
    .alert.success { background: #eaf7ee; color: #234d39; border: 1px solid #b9d9bf; }
    form { display: grid; gap: 16px; }
    label { font-weight: 600; font-size: 0.92rem; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d9dcd1; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #315c45; color: #fff; font-weight: 700; cursor: pointer; }
    .link-row { margin-top: 18px; text-align: center; color: #586157; }
    .link-row a { color: #315c45; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body class="auth-page">
  <header th:replace="~{fragments/navbar :: navbar('login')}"></header>
  <script th:src="@{/js/navbar.js}" defer></script>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Iniciar sesión</h1>
      <p>Accede con tu correo y contraseña.</p>

      <div th:if="${param.error}" class="alert error">Credenciales inválidas. Inténtalo de nuevo.</div>
      <div th:if="${param.logout}" class="alert success">Has cerrado sesión correctamente.</div>
      <div th:if="${successMessage}" class="alert success" th:text="${successMessage}">Cuenta creada.</div>
      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error.</div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
          <label for="username">Correo</label>
          <input id="username" type="email" name="username" placeholder="tu@correo.com" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Entrar</button>
      </form>

      <div class="link-row">
        <span>¿No tienes cuenta?</span>
        <a th:href="@{/register}">Regístrate</a>
      </div>
    </div>
  </div>
</body>
</html>
