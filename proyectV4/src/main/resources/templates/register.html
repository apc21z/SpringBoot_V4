<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Registro</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: linear-gradient(135deg, #f4f3ed 0%, #eef7f1 100%); }
    .auth-shell { width: min(460px, calc(100% - 28px)); }
    .auth-card { background: #fffefa; border: 1px solid #d9dcd1; border-radius: 18px; box-shadow: 0 18px 38px rgba(49,92,69,0.08); padding: 32px; }
    .auth-card h1 { font-size: 2rem; margin: 0 0 8px; }
    .auth-card p { color: #686f65; margin: 0 0 20px; }
    .alert { padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-size: 0.94rem; }
    .alert.error { background: #fde9e6; color: #a23d2c; border: 1px solid #e5b2a8; }
    form { display: grid; gap: 16px; }
    label { font-weight: 600; font-size: 0.92rem; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d9dcd1; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #315c45; color: #fff; font-weight: 700; cursor: pointer; }
    .link-row { margin-top: 18px; text-align: center; color: #586157; }
    .link-row a { color: #315c45; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Crear cuenta</h1>
      <p>Regístrate para entrar a la zona privada.</p>

      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error.</div>

      <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
          <label for="email">Correo</label>
          <input id="email" type="email" name="email" placeholder="tu@correo.com" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="Mínimo 8 caracteres" required>
        </div>
        <button type="submit">Registrarme</button>
      </form>

      <div class="link-row">
        <span>¿Ya tienes cuenta?</span>
        <a th:href="@{/login}">Inicia sesión</a>
      </div>
    </div>
  </div>
</body>
</html>
