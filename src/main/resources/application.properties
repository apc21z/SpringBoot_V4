spring.application.name=proyectV4
# Sirve para habilitar el uso de hilos virtuales en Spring Boot, lo que puede mejorar el rendimiento y la escalabilidad de la aplicación 
# al permitir un mayor número de hilos concurrentes sin consumir tantos recursos del sistema.
spring.threads.virtual.enabled=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/proyectv4
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
#local-dev-secret-key-for-testing-only-32-bytes-minimum
security.jwt.secret='LocalDevSecretKey32BytesTest021'
security.jwt.expiration-ms=900000
