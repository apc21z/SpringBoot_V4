<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/account.css">
</head>
<body class="account-page admin-page">
  <div class="wrap">
    <div class="card">
      <div class="badge">Zona privada de admin</div>
      <h1>Panel de administración</h1>
      <p>Has entrado como <strong th:text="${username}">admin</strong>. Esta vista solo es accesible para usuarios con rol ADMIN.</p>
      <p>Puedes usar la cuenta por defecto:</p>
      <p><strong>Email:</strong> admin@admin.com<br><strong>Password:</strong> admin123</p>
      <div class="actions">
        <a class="btn primary" th:href="@{/dashboard}"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>Volver al dashboard</a>
        <a class="btn secondary" th:href="@{/}"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
        <form class="logout-form" th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="logout logout-button"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
