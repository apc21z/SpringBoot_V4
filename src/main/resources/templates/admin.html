<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { margin: 0; background: #f4f3ed; color: #20251f; font-family: "Segoe UI", sans-serif; }
    .wrap { width: min(900px, calc(100% - 28px)); margin: 60px auto; }
    .card { background: #fffefa; border: 1px solid #d9dcd1; border-radius: 18px; padding: 28px; box-shadow: 0 12px 30px rgba(49,92,69,0.06); }
    .badge { display: inline-block; margin-bottom: 12px; padding: 6px 10px; border-radius: 999px; background: #fde9e6; color: #a23d2c; font-size: 0.8rem; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.7rem); }
    p { color: #686f65; line-height: 1.7; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    .btn.primary { background: #315c45; color: #fff; }
    .btn.secondary { background: #edf4ee; color: #234d39; }
    .logout { color: #315c45; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">Zona privada de admin</div>
      <h1>Panel de administración</h1>
      <p>Has entrado como <strong th:text="${username}">admin</strong>. Esta vista solo es accesible para usuarios con rol ADMIN.</p>
      <p>Puedes usar la cuenta por defecto:</p>
      <p><strong>Email:</strong> admin@admin.com<br><strong>Password:</strong> admin123</p>
      <div class="actions">
        <a class="btn primary" th:href="@{/dashboard}">Volver al dashboard</a>
        <a class="btn secondary" th:href="@{/}">Inicio</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="logout" style="background:none;border:0;padding:0;font:inherit;cursor:pointer;color:#315c45;font-weight:700;">Cerrar sesión</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
