<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { margin: 0; background: radial-gradient(ellipse at 15% 10%, #f9dfea 0, transparent 34%), radial-gradient(ellipse at 90% 80%, #d9f2f5 0, transparent 36%), #fff8fc; color: #30263a; font-family: "Segoe UI", sans-serif; }
    .wrap { width: min(900px, calc(100% - 28px)); margin: 60px auto; }
    .card { background: #fffdfd; border: 1px solid #eadce9; border-radius: 8px; padding: 28px; box-shadow: 0 12px 30px rgba(120,100,181,0.1); }
    .badge { display: inline-block; margin-bottom: 12px; padding: 6px 10px; border-radius: 999px; background: #f9e2ed; color: #98405e; font-size: 0.8rem; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.7rem); }
    p { color: #766a7a; line-height: 1.7; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    .btn.primary { background: #237f82; color: #fff; }
    .btn.secondary { background: #f3effa; color: #58458d; }
    .logout { color: #237f82; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">Zona privada de admin</div>
      <h1>Panel de administración</h1>
      <p>Has entrado como <strong th:text="${username}">admin</strong>. Esta vista solo es accesible para usuarios con rol ADMIN.</p>
      <p>Puedes usar la cuenta por defecto:</p>
      <p><strong>Email:</strong> admin@admin.com<br><strong>Password:</strong> admin123</p>
      <div class="actions">
        <a class="btn primary" th:href="@{/dashboard}"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>Volver al dashboard</a>
        <a class="btn secondary" th:href="@{/}"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="logout" style="display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;font:inherit;cursor:pointer;color:#237f82;font-weight:700;"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
