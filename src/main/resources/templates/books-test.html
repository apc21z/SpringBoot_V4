<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador API de libros</title>
    <link rel="stylesheet" href="/css/books-test.css">
</head>
<body>
    <div class="wrap">
        <h1><svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#7864b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>Probador de API de libros</h1>
        <div class="grid">
            <section class="card">
                <h2><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#e96991" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Autenticación</h2>
                <form id="loginForm">
                    <label>
                        Correo
                        <input id="username" type="email" value="admin@admin.com" placeholder="admin@example.com">
                    </label>
                    <label>
                        Contraseña
                        <input id="password" type="password" value="admin123" placeholder="********">
                    </label>
                    <button type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Iniciar sesión</button>
                </form>

            </section>

            <section class="card">
                <h2><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#83a83e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>Operaciones</h2>
                <form id="crudForm">
                    <label>
                        ID
                        <input id="bookId" type="number" min="1" placeholder="1">
                    </label>
                    <label>
                        Título
                        <input id="title" type="text" value="Clean Code" maxlength="255" required>
                    </label>
                    <label>
                        Autor
                        <input id="author" type="text" value="Robert C. Martin" maxlength="255" required>
                    </label>
                    <label>
                        ISBN
                        <input id="isbn" type="text" value="9780132350884" maxlength="255" required>
                    </label>
                    <section class="pages-editor" aria-labelledby="pagesTitle">
                        <div class="pages-heading">
                            <h3 id="pagesTitle">Páginas del libro</h3>
                            <button class="secondary" type="button" id="addPageBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar página</button>
                        </div>
                        <div class="page-list" id="pagesList"></div>
                    </section>

                    <div class="operation-actions">
                        <button type="button" id="listBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Listar</button>
                        <button type="button" id="getBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Obtener por ID</button>
                        <button type="button" id="createBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Crear</button>
                        <button type="button" id="updateBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>Actualizar</button>
                        <button type="button" class="danger" id="deleteBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>Eliminar</button>
                    </div>
                </form>
            </section>
        </div>

        <div class="card response-card">
            <div id="status" class="status warn">Sin ejecución todavía.</div>
            <pre id="responseOutput" class="output">{}</pre>
        </div>
    </div>

    <script src="/js/books-test.js" defer></script>
</body>
</html>
