<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --primary: #2f6fed;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dfe3ec;
            --success: #0f766e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        }
        h1 { margin-top: 0; }
        .actions {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        a, button {
            text-decoration: none;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
        }
        a {
            background: #edf3ff;
            color: var(--primary);
        }
        button {
            background: var(--primary);
            color: white;
        }
        #book-list {
            list-style: none;
            padding-left: 0;
            display: grid;
            gap: 12px;
        }
        #book-list li {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            background: #fafbff;
        }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Libros</h1>
            <p class="muted">Listado de libros consultado desde la API REST.</p>

            <div class="actions">
                <button type="button" id="loadBooksBtn">Cargar libros</button>
                <a href="/books/test">Abrir probador API</a>
            </div>

            <ul id="book-list">
                <li>Cargando libros...</li>
            </ul>
        </div>
    </div>

    <script>
        const listEl = document.getElementById('book-list');
        const token = localStorage.getItem('bookToken') || '';

        async function loadBooks() {
            listEl.innerHTML = '<li>Cargando libros...</li>';
            try {
                const response = await fetch('/api/books', {
                    headers: {
                        'Authorization': token ? `Bearer ${token}` : ''
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const books = await response.json();
                if (!books.length) {
                    listEl.innerHTML = '<li>No hay libros registrados.</li>';
                    return;
                }

                listEl.innerHTML = books.map(book => `
                    <li>
                        <strong>${book.title}</strong><br>
                        <span class="muted">Autor:</span> ${book.author}<br>
                        <span class="muted">ISBN:</span> ${book.isbn}
                    </li>
                `).join('');
            } catch (error) {
                listEl.innerHTML = `<li>${error.message}</li>`;
            }
        }

        document.getElementById('loadBooksBtn').addEventListener('click', loadBooks);
        loadBooks();
    </script>
</body>
</html>
