<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros</title>
    <link rel="stylesheet" href="/css/books.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#7864b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14M3 18V5a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-4a3 3 0 0 0-3 2 3 3 0 0 0-3-2H5a2 2 0 0 1-2-2z"/></svg>Libros</h1>
            <p class="muted">Listado paginado de libros y contenido de sus páginas.</p>

            <div class="actions">
                <a href="/books/test"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>Abrir probador API</a>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Título</th>
                            <th scope="col">Autor</th>
                            <th scope="col">ISBN</th>
                            <th scope="col">Páginas</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${bookPage.content}">
                            <td th:text="${book.title}">Título</td>
                            <td th:text="${book.author}">Autor</td>
                            <td th:text="${book.isbn}">ISBN</td>
                            <td>
                                <details>
                                    <summary th:text="|Páginas (${#lists.size(book.pages)})|">Páginas (0)</summary>
                                    <ol>
                                        <li th:each="bookPageContent : ${book.pages}">
                                            <strong th:text="${bookPageContent.title}">Título de página</strong>
                                            <p th:text="${bookPageContent.text}">Contenido</p>
                                        </li>
                                    </ol>
                                </details>
                            </td>
                        </tr>
                        <tr th:if="${bookPage.empty}"><td colspan="4">No hay libros registrados.</td></tr>
                    </tbody>
                </table>
            </div>
            <nav class="pagination" aria-label="Paginación de libros" th:if="${bookPage.totalElements > 0}">
                <a th:if="${bookPage.hasPrevious()}" th:href="@{/books(page=${bookPage.number - 1})}" rel="prev"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Anterior</a>
                <span class="disabled" aria-disabled="true" th:unless="${bookPage.hasPrevious()}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Anterior</span>
                <span class="muted" aria-live="polite" th:text="|${bookPage.numberOfElements} / ${bookPage.totalElements} elementos|">5 / 5 elementos</span>
                <span class="muted" th:text="|Página ${bookPage.number + 1} / ${bookPage.totalPages}|">Página 1 / 1</span>
                <a th:if="${bookPage.hasNext()}" th:href="@{/books(page=${bookPage.number + 1})}" rel="next">Siguiente<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
                <span class="disabled" aria-disabled="true" th:unless="${bookPage.hasNext()}">Siguiente<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
            </nav>
        </div>
    </div>

</body>
</html>
