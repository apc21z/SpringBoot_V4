<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --primary: #2f6fed;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dfe3ec;
            --success: #0f766e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        }
        h1 { margin-top: 0; }
        .actions {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        a, button {
            text-decoration: none;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
        }
        a {
            background: #edf3ff;
            color: var(--primary);
        }
        button {
            background: var(--primary);
            color: white;
        }
        #book-list {
            list-style: none;
            padding-left: 0;
            display: grid;
            gap: 12px;
        }
        #book-list li {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            background: #fafbff;
        }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Libros</h1>
            <p class="muted">Listado de libros y contenido de sus páginas consultado desde la API REST.</p>

            <div class="actions">
                <button type="button" id="loadBooksBtn">Cargar libros</button>
                <a href="/books/test">Abrir probador API</a>
            </div>

            <ul id="book-list">
                <li>Cargando libros...</li>
            </ul>
        </div>
    </div>

    <script>
        const listEl = document.getElementById('book-list');
        const token = localStorage.getItem('bookToken') || '';

        function showMessage(message) {
            const item = document.createElement('li');
            item.textContent = message;
            listEl.replaceChildren(item);
        }

        function appendMetadata(item, label, value) {
            const row = document.createElement('p');
            const labelElement = document.createElement('span');
            labelElement.className = 'muted';
            labelElement.textContent = `${label}: `;
            const valueElement = document.createElement('span');
            valueElement.textContent = value ?? '';
            row.append(labelElement, valueElement);
            item.append(row);
        }

        function renderBook(book) {
            const item = document.createElement('li');
            const title = document.createElement('strong');
            title.textContent = book.title;
            item.append(title);

            appendMetadata(item, 'Autor', book.author);
            appendMetadata(item, 'ISBN', book.isbn);

            const pages = Array.isArray(book.pages) ? book.pages : [];
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = `Páginas (${pages.length})`;
            details.append(summary);

            const pageList = document.createElement('ol');
            pages.forEach(page => {
                const pageItem = document.createElement('li');
                const pageTitle = document.createElement('strong');
                pageTitle.textContent = page.title;
                const pageText = document.createElement('p');
                pageText.textContent = page.text;
                pageItem.append(pageTitle, pageText);
                pageList.append(pageItem);
            });
            details.append(pageList);
            item.append(details);
            return item;
        }

        async function loadBooks() {
            showMessage('Cargando libros...');
            try {
                const response = await fetch('/api/books', {
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const books = await response.json();
                if (!books.length) {
                    showMessage('No hay libros registrados.');
                    return;
                }

                listEl.replaceChildren(...books.map(renderBook));
            } catch (error) {
                showMessage(error.message);
            }
        }

        document.getElementById('loadBooksBtn').addEventListener('click', loadBooks);
        loadBooks();
    </script>
</body>
</html>
