<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { min-height: 100vh; background: radial-gradient(ellipse at 12% 15%, #f9dfea 0, transparent 34%), radial-gradient(ellipse at 88% 75%, #d9f2f5 0, transparent 36%), #fff8fc; }
    .auth-page .site-navbar { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }
    .auth-shell { width: min(440px, calc(100% - 28px)); margin: clamp(48px, 9vh, 88px) auto 48px; }
    .auth-card { background: #fffdfd; border: 1px solid #eadce9; border-radius: 8px; box-shadow: 0 18px 40px rgba(120,100,181,0.12); padding: 32px; }
    .auth-card h1 { font-size: 2rem; margin: 0 0 8px; }
    .auth-card p { color: #766a7a; margin: 0 0 20px; }
    .alert { padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-size: 0.94rem; }
    .alert.error { background: #fde9e6; color: #a23d2c; border: 1px solid #e5b2a8; }
    .alert.success { background: #f5f9d9; color: #475f22; border: 1px solid #dce99e; }
    form { display: grid; gap: 16px; }
    label { font-weight: 600; font-size: 0.92rem; }
    input { width: 100%; padding: 12px 14px; border-radius: 4px; border: 1px solid #eadce9; font: inherit; }
    input:focus { outline: 2px solid #83cde0; outline-offset: 2px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 4px; padding: 12px 16px; background: #237f82; color: #fff; font-weight: 700; cursor: pointer; }
    .link-row { margin-top: 18px; text-align: center; color: #766a7a; }
    .link-row a { color: #7864b5; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body class="auth-page">
  <header th:replace="~{fragments/navbar :: navbar('login')}"></header>
  <script th:src="@{/js/navbar.js}" defer></script>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Iniciar sesión</h1>
      <p>Accede con tu correo y contraseña.</p>

      <div th:if="${param.error}" class="alert error">Credenciales inválidas. Inténtalo de nuevo.</div>
      <div th:if="${param.logout}" class="alert success">Has cerrado sesión correctamente.</div>
      <div th:if="${successMessage}" class="alert success" th:text="${successMessage}">Cuenta creada.</div>
      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error.</div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
          <label for="username">Correo</label>
          <input id="username" type="email" name="username" placeholder="tu@correo.com" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Entrar</button>
      </form>

      <div class="link-row">
        <span>¿No tienes cuenta?</span>
        <a th:href="@{/register}">Regístrate</a>
      </div>
    </div>
  </div>
</body>
</html>
