<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page login-page">
  <header th:replace="~{fragments/navbar :: navbar('login')}"></header>
  <script th:src="@{/js/navbar.js}" defer></script>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Iniciar sesión</h1>
      <p>Accede con tu correo y contraseña.</p>

      <div th:if="${param.error}" class="alert error">Credenciales inválidas. Inténtalo de nuevo.</div>
      <div th:if="${param.logout}" class="alert success">Has cerrado sesión correctamente.</div>
      <div th:if="${successMessage}" class="alert success" th:text="${successMessage}">Cuenta creada.</div>
      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error.</div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
          <label for="username">Correo</label>
          <input id="username" type="email" name="username" placeholder="tu@correo.com" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Entrar</button>
      </form>

      <div class="link-row">
        <span>¿No tienes cuenta?</span>
        <a th:href="@{/register}">Regístrate</a>
      </div>
    </div>
  </div>
</body>
</html>
