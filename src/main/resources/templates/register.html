<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProyectV4 | Registro</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page register-page">
  <header th:replace="~{fragments/navbar :: navbar('register')}"></header>
  <script th:src="@{/js/navbar.js}" defer></script>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Crear cuenta</h1>
      <p>Regístrate para entrar a la zona privada.</p>

      <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}">Error.</div>

      <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div>
          <label for="email">Correo</label>
          <input id="email" type="email" th:field="*{email}" th:value="${registerForm.email}" placeholder="tu@correo.com" required>
          <p class="form-status error" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="Mínimo 8 caracteres" required>
          <p class="form-status error" role="alert" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <button type="submit"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Registrarme</button>
      </form>

      <div class="link-row">
        <span>¿Ya tienes cuenta?</span>
        <a th:href="@{/login}">Inicia sesión</a>
      </div>
    </div>
  </div>
</body>
</html>
