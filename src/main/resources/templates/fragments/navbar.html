<header th:fragment="navbar(currentPage)" class="topbar site-navbar"
        xmlns:th="http://www.thymeleaf.org">
  <a class="brand" href="/" aria-label="ProyectV4, inicio">
    <span class="brand-mark" aria-hidden="true">P3</span>
    <span>ProyectV4</span>
  </a>
  <button class="site-nav-toggle" type="button" aria-label="Abrir menú"
          aria-controls="site-navigation" aria-expanded="false" data-nav-toggle>
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="site-nav-links" id="site-navigation" aria-label="Navegación principal">
    <a href="/#inicio"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="/#routes"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="2" cy="6" r=".5"/><circle cx="2" cy="12" r=".5"/><circle cx="2" cy="18" r=".5"/></svg>Rutas</a>
    <a th:if="${currentPage == 'index'}" href="/people"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1M16 5.5a3 3 0 0 1 0 5.8M18 14a5 5 0 0 1 3 4.6V20"/></svg>Personas</a>
    <a th:if="${currentPage == 'index'}" href="/thymeTest"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>Thymeleaf</a>
    <a th:if="${currentUser != null}" href="/dashboard"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>Panel</a>
  </nav>
  <div class="site-nav-actions">
    <a class="site-nav-cta" th:if="${currentUser == null}"
       th:href="${currentPage == 'login'} ? @{/register} : @{/login}"
      ><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg><span th:text="${currentPage == 'login'} ? 'Crear cuenta' : 'Iniciar sesión'">Iniciar sesión</span></a>
    <form class="site-nav-logout-form" th:if="${currentUser != null}"
          th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="site-nav-cta" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</button>
    </form>
  </div>
</header>
